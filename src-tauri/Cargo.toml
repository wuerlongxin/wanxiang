[package]
name = "wanxiang-deck"
version = "0.1.2"
description = "Wanxiang Deck desktop application"
authors = ["Wanxiang Deck Team"]
edition = "2024"
rust-version = "1.97"

[lib]
name = "wanxiang_deck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
base64 = "0.22"
blake3 = "1"
futures-util = "0.3"
if-addrs = "0.13"
jpeg-encoder = "=0.7.1"
lcms2 = { version = "=6.1.1", features = ["static"] }
libp2p = { version = "0.54", default-features = false, features = ["identify", "macros", "mdns", "ping", "quic", "request-response", "tokio"] }
# 0.11.16 currently requests a removed rand feature under Cargo 1.97.
quinn-proto = { version = "=0.11.15", default-features = false }
regex = "1"
rfd = "0.15"
png = "=0.18.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
unicode-normalization = "0.1"
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
